
name: Security Scan (Trivy + Gitleaks + Semgrep)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  trivy-scan:
    name: Trivy (dependencies & IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy & Save Output as JSON
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          skip-dirs: 'tests,node_modules,vendor,.venv'
          trivyignores: '.trivyignore'

      - name: Upload Trivy results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

      - name: Send Trivy JSON to Webhook
        if: always()
        run: |
          if [ -f trivy-results.json ]; then
            curl -s --max-time 90 -X POST "https://trivy-scanner-backend.onrender.com/api/trivy-webhook" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${{ secrets.TRIVY_WEBHOOK_SECRET }}" \
              -H "X-Scan-Tool: trivy" \
              -H "X-Repo: ${{ github.repository }}" \
              -H "X-Commit: ${{ github.sha }}" \
              -d @trivy-results.json
          fi

  gitleaks-scan:
    name: Gitleaks (secrets detection)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep tag_name | cut -d '"' -f4 | tr -d v)
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks (JSON report)
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-results.json \
            --config .gitleaks.toml \
            --baseline-path gitleaks-baseline.json \
            --exit-code 0 \
            --no-banner
        continue-on-error: true

      - name: Ensure report file exists (π.χ. αν δεν βρέθηκε κανένα leak)
        if: always()
        run: test -f gitleaks-results.json || echo "[]" > gitleaks-results.json

      - name: Upload Gitleaks results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json

      - name: Send Gitleaks report to Webhook
        if: always()
        run: |
          curl -s --max-time 90 -X POST "https://trivy-scanner-backend.onrender.com/api/trivy-webhook" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${{ secrets.TRIVY_WEBHOOK_SECRET }}" \
            -H "X-Scan-Tool: gitleaks" \
            -H "X-Repo: ${{ github.repository }}" \
            -H "X-Commit: ${{ github.sha }}" \
            -d @gitleaks-results.json

  semgrep-scan:
    name: Semgrep (static code analysis)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep (baseline diff on PRs, full scan on push to main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            semgrep ci \
              --baseline-commit=${{ github.event.pull_request.base.sha }} \
              --config p/python --config p/flask --config p/security-audit \
              --exclude tests --exclude node_modules --exclude vendor \
              --json --output semgrep-raw.json
          else
            semgrep scan \
              --config p/python --config p/flask --config p/security-audit \
              --exclude tests --exclude node_modules --exclude vendor \
              --json --output semgrep-raw.json
          fi
        continue-on-error: true

      - name: Filter out LOW confidence findings (reduce noise)
        run: |
          jq '.results |= map(select(.extra.metadata.confidence != "LOW"))' \
            semgrep-raw.json > semgrep-results.json

      - name: Upload Semgrep results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

      - name: Send Semgrep JSON to Webhook
        if: always()
        run: |
          if [ -f semgrep-results.json ]; then
            curl -s --max-time 90 -X POST "https://trivy-scanner-backend.onrender.com/api/trivy-webhook" \
              -H "Content-Type: application/json" \
              -H "X-Webhook-Secret: ${{ secrets.TRIVY_WEBHOOK_SECRET }}" \
              -H "X-Scan-Tool: semgrep" \
              -H "X-Repo: ${{ github.repository }}" \
              -H "X-Commit: ${{ github.sha }}" \
              -d @semgrep-results.json
          fi
